<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Otome Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main id="game">
        <section id="start-screen" class="screen">
            <div class="title-card">
                <h1>Meu Otome Game</h1>
                <p>Uma pequena história começa aqui...</p>
                <button id="start-button">Começar</button>
            </div>
        </section>

        <section id="game-screen" class="screen hidden">
            <div id="scene">
                <div id="characters"></div>

                <div id="dialogue-box">
                    <div id="character-name">Narrador</div>
                    <p id="dialogue-text"></p>
                    <div id="choices"></div>
                    <button id="next-button">Continuar</button>
                </div>
            </div>

            <div id="status">
                <span>❤️ Afinidade: <strong id="affection-value">0</strong></span>
                <button id="save-button">Salvar</button>
                <button id="load-button">Carregar</button>
            </div>
        </section>

        <section id="ending-screen" class="screen hidden">
            <h2 id="ending-title"></h2>
            <p id="ending-text"></p>
            <button id="restart-button">Jogar novamente</button>
        </section>
    </main>

    <script src="js/characters.js"></script>
    <script src="js/stories.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
